<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: header}"></head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container">
    <form class="mt-3"
          th:action="@{/candidates/create}"
          method="post">

        <!-- Имя кандидата -->
        <div class="mb-3">
            <label for="name" class="form-label">
                <b>Имя кандидата</b>
            </label>
            <input type="text"
                   class="form-control"
                   id="name"
                   name="name"
                   placeholder="Введите имя кандидата"
                   required>
        </div>

        <!-- Резюме -->
        <div class="mb-3">
            <label for="description" class="form-label">
                <b>Резюме</b>
            </label>
            <textarea class="form-control"
                      id="description"
                      name="description"
                      rows="15"
                      placeholder="Опишите опыт работы и навыки кандидата"></textarea>
        </div>

        <!-- Выбор города -->
        <div class="mb-3">
            <label for="cityId" class="form-label">
                <b>Город</b>
            </label>

            <select class="form-select"
                    id="cityId"
                    name="cityId"
                    required>

                <option value="" selected disabled>
                    Выберите город
                </option>

                <option th:each="city : ${cities}"
                        th:value="${city.id}"
                        th:text="${city.name}">
                </option>
            </select>
        </div>

        <!-- Кнопки -->
        <div class="mb-3 row">
            <div class="col-6"></div>
            <div class="col-6">
                <div class="row">
                    <div class="col-6">
                        <a class="btn btn-danger w-100"
                           th:href="@{/candidates}">
                            Отмена
                        </a>
                    </div>
                    <div class="col-6">
                        <button class="btn btn-primary w-100"
                                type="submit">
                            Сохранить
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </form>
</div>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>

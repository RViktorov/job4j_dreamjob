<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{header :: header}"></head>
<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container">
    <form class="mt-3"
          th:action="@{/candidates/update}"
          method="post"
          th:object="${candidate}">

        <input type="hidden" th:field="*{id}">

        <!-- Имя кандидата -->
        <div class="mb-3">
            <label for="name" class="form-label">
                <b>Имя кандидата</b>
            </label>
            <input type="text"
                   class="form-control"
                   id="name"
                   th:field="*{name}"
                   required>
        </div>

        <!-- Дата создания -->
        <div class="mb-3">
            <label class="form-label">
                <b>Дата создания резюме</b>
            </label>
            <p th:text="${#temporals.format(
                candidate.creationDate, 'dd.MM.yyyy HH:mm')}">
            </p>
        </div>

        <!-- Резюме -->
        <div class="mb-3">
            <label for="description" class="form-label">
                <b>Резюме</b>
            </label>
            <textarea class="form-control"
                      id="description"
                      th:field="*{description}"
                      rows="15"></textarea>
        </div>

        <!-- Город -->
        <div class="mb-3">
            <label for="cityId" class="form-label">
                <b>Город</b>
            </label>

            <select class="form-select"
                    id="cityId"
                    th:field="*{cityId}"
                    required>

                <option th:each="city : ${cities}"
                        th:value="${city.id}"
                        th:text="${city.name}">
                </option>
            </select>
        </div>

        <!-- Кнопки -->
        <div class="mb-3 row">
            <div class="col-6"></div>
            <div class="col-6">
                <div class="row">

                    <div class="col-4">
                        <a class="btn btn-light w-100"
                           th:href="@{/candidates}">
                            Отмена
                        </a>
                    </div>

                    <div class="col-4">
                        <a class="btn btn-danger w-100"
                           th:href="@{/candidates/delete/{id}(id=${candidate.id})}">
                            Удалить
                        </a>
                    </div>

                    <div class="col-4">
                        <button class="btn btn-success w-100"
                                type="submit">
                            Обновить
                        </button>
                    </div>

                </div>
            </div>
        </div>

    </form>
</div>

<footer th:replace="~{footer :: footer}"></footer>
</body>
</html>

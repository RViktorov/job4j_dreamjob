<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="header :: header"></head>
<body>
<div th:replace="fragments/navigation :: navigation"></div>

<div class="container">
    <div class="row">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Название вакансии</th>
                <th scope="col">Дата создания</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="vacancy : ${vacancies}">
                <td th:text="${vacancy.id}"></td>
                <td>
                    <a th:text="${vacancy.title}"
                       th:href="@{/vacancies/{vacancyId}(vacancyId=${vacancy.id})}">
                    </a>
                </td>
                <td th:text="${#temporals.format(vacancy.creationDate, 'dd.MM.yyyy HH:mm')}">
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<footer th:include="footer :: footer"></footer>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: header}"></head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <h3 class="mb-4">Создание вакансии</h3>

            <form class="mt-3"
                  th:action="@{/vacancies/create}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Название вакансии -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        <b>Название</b>
                    </label>

                    <input type="text"
                           class="form-control"
                           id="title"
                           name="title"
                           placeholder="Например, Ведущий Java разработчик"
                           required>
                </div>

                <!-- Фото -->
                <div class="mb-3">
                    <label for="formFile" class="form-label">
                        <b>Фото</b>
                    </label>

                    <input class="form-control"
                           type="file"
                           id="formFile"
                           name="file"
                           accept="image/*"
                           required>
                </div>

                <!-- Описание вакансии -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        <b>Описание</b>
                    </label>

                    <textarea class="form-control"
                              id="description"
                              name="description"
                              rows="10"
                              placeholder="Опишите требования к кандидату"></textarea>
                </div>

                <!-- Публикация -->
                <div class="form-check mb-3">
                    <input type="checkbox"
                           name="visible"
                           class="form-check-input"
                           id="visible">

                    <label class="form-check-label" for="visible">
                        Опубликовать
                    </label>
                </div>

                <!-- Город -->
                <div class="mb-3">
                    <label for="cityId" class="form-label">
                        <b>Город</b>
                    </label>

                    <select class="form-select"
                            id="cityId"
                            name="cityId"
                            required>

                        <option value="" selected disabled>
                            Выберите город
                        </option>

                        <option th:each="city : ${cities}"
                                th:value="${city.id}"
                                th:text="${city.name}">
                        </option>

                    </select>
                </div>

                <!-- Кнопки -->
                <div class="d-flex justify-content-end gap-2 mt-4">

                    <a class="btn btn-danger"
                       th:href="@{/vacancies}">
                        Отмена
                    </a>

                    <button class="btn btn-primary"
                            type="submit">
                        Сохранить
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>

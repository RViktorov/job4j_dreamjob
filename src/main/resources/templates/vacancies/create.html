
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: header}"></head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container mt-4">

    <div class="row">
        <div class="col-md-8 offset-md-2">

            <h3 class="mb-4">Создание вакансии</h3>

            <form th:action="@{/vacancies/create}"
                  method="post"
                  enctype="multipart/form-data">

                <!-- Название вакансии -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        Название вакансии
                    </label>

                    <input type="text"
                           class="form-control"
                           id="title"
                           name="title"
                           placeholder="Например, Java-разработчик"
                           required>
                </div>

                <!-- Описание вакансии -->
                <div class="mb-3">
                    <label for="description" class="form-label">
                        Описание вакансии
                    </label>

                    <textarea class="form-control"
                              id="description"
                              name="description"
                              rows="5"
                              placeholder="Введите описание вакансии"
                              required></textarea>
                </div>

                <!-- Город -->
                <div class="mb-3">
                    <label for="cityId" class="form-label">
                        Город
                    </label>

                    <select class="form-select"
                            id="cityId"
                            name="cityId"
                            required>

                        <option value="">
                            Выберите город
                        </option>

                        <option th:each="city : ${cities}"
                                th:value="${city.id}"
                                th:text="${city.name}">
                        </option>

                    </select>
                </div>

                <!-- Загрузка файла -->
                <div class="mb-3">
                    <label for="file" class="form-label">
                        Прикрепить файл
                    </label>

                    <input type="file"
                           class="form-control"
                           id="file"
                           name="file">

                    <div class="form-text">
                        Выберите файл для прикрепления к вакансии.
                    </div>
                </div>

                <!-- Кнопки -->
                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">
                        Сохранить
                    </button>

                    <a th:href="@{/vacancies}"
                       class="btn btn-secondary">
                        Отмена
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: header}"></head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <h3 class="mb-4">Создание вакансии</h3>

            <form th:action="@{/vacancies/create}" method="post">

                <div class="mb-3">
                    <label for="title" class="form-label">
                        Название вакансии
                    </label>
                    <input type="text"
                           class="form-control"
                           id="title"
                           name="title"
                           placeholder="Например, Ведущий Java разработчик"
                           required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Описание вакансии
                    </label>
                    <textarea class="form-control"
                              id="description"
                              name="description"
                              rows="10"
                              placeholder="Опишите требования к кандидату"></textarea>
                </div>

                <div class="mb-3">
                    <label for="cityId" class="form-label">
                        Город
                    </label>
                    <select class="form-select"
                            id="cityId"
                            name="cityId"
                            required>
                        <option value="" selected disabled>
                            Выберите город
                        </option>
                        <option th:each="city : ${cities}"
                                th:value="${city.id}"
                                th:text="${city.name}">
                        </option>
                    </select>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox"
                           class="form-check-input"
                           id="visible"
                           name="visible">
                    <label class="form-check-label" for="visible">
                        Опубликовать вакансию
                    </label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-secondary"
                       th:href="@{/vacancies}">
                        Отмена
                    </a>
                    <button class="btn btn-primary" type="submit">
                        Сохранить
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{header :: header}"></head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<div class="container mt-4">

    <h2>Добро пожаловать в Dream Job!</h2>

    <p class="lead">
        Платформа для поиска работы и размещения резюме.
    </p>

    <div class="row mt-4">

        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">

                    <h5 class="card-title">Вакансии</h5>

                    <p class="card-text">
                        Просматривайте доступные вакансии
                        и размещайте новые предложения.
                    </p>

                    <a th:href="@{/vacancies}"
                       class="btn btn-primary">
                        Смотреть вакансии
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card">
                <div class="card-body">

                    <h5 class="card-title">Кандидаты</h5>

                    <p class="card-text">
                        Просматривайте резюме кандидатов
                        и добавляйте новые.
                    </p>

                    <a th:href="@{/candidates}"
                       class="btn btn-primary">
                        Смотреть кандидатов
                    </a>

                </div>
            </div>
        </div>

    </div>
</div>

<footer th:replace="~{footer :: footer}"></footer>

</body>
</html>
